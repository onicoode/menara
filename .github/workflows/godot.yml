name: Godot (tes, Web, AAB)

on:
  push:
    branches: [main]
    paths: ["godot/**", ".github/workflows/godot.yml"]
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Bangun AAB bertanda tangan (butuh secrets keystore)"
        type: boolean
        default: false

env:
  GODOT_VERSION: "4.4.1"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Impor proyek
        run: godot --headless --path godot --import || true
      - name: Tes data (setara game HTML5)
        run: godot --headless --path godot res://tests/selftest.tscn | tee /tmp/selftest.log; grep -q "SELFTEST OK" /tmp/selftest.log
      - name: Tes simulasi pertempuran
        run: godot --headless --path godot res://tests/simtest.tscn | tee /tmp/simtest.log; grep -q "malam1" /tmp/simtest.log
      - name: Tes audio
        run: godot --headless --path godot res://tests/audiotest.tscn | tee /tmp/audio.log; grep -q "AUDIO PLAY OK" /tmp/audio.log

  web:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Ekspor Web
        run: |
          mkdir -p godot/build/web
          godot --headless --path godot --import || true
          godot --headless --path godot --export-release "Web" build/web/index.html
          cp -r docs/. godot/build/web/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: godot/build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  aab:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.build_aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Pasang platform Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1" "platform-tools" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      - name: Siapkan template Android dan pengaturan editor
        run: |
          TPL=$(ls -d ~/.local/share/godot/export_templates/*/ | head -1)
          mkdir -p godot/android/build
          unzip -q -o "$TPL/android_source.zip" -d godot/android/build
          echo "${GODOT_VERSION}.stable" > godot/android/.build_version
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOT
      - name: Keystore dari secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Ekspor AAB
        run: |
          mkdir -p godot/build
          godot --headless --path godot --import || true
          godot --headless --path godot --export-release "Android AAB" build/menara-rongsok.aab
      - uses: actions/upload-artifact@v4
        with:
          name: menara-rongsok-aab
          path: godot/build/menara-rongsok.aab
